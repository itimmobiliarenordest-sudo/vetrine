<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Dashboard Vetrine</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f4f9;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
  }

  h1 {
    text-align: center;
    color: #b30933;
    margin-top: 20px;
  }

  label { 
    font-weight: bold; 
    color: #4c565c;
    margin-right: 10px;
  }
  select { 
    padding: 8px 15px; 
    margin: 10px 0; 
    font-size: 16px; 
    border: 2px solid #b30933; 
    border-radius: 8px; 
    background-color: white; 
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b30933' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 10px center;
    padding-right: 40px; 
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  select:focus {
    border-color: #007bff;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.25);
    outline: none;
  }
  
  .cerca-container {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
  }
  
  #inputRicerca {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
  }

  .griglia {
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
    min-height: 350px;
    position: relative;
    margin-top: 20px;
  }

  .riga { display: flex; gap: 10px; justify-content: center; }

  .blocco {
    display: flex;
    gap: 8px;
    padding: 5px;
    border-right: 3px solid #4c565c;
    transition: transform 0.3s;
  }

  .blocco:last-child { border-right: none; }

  .cella {
    width: 90px; height: 80px;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    box-sizing: border-box;
    cursor: pointer;
    padding: 5px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    transition: transform 0.3s, box-shadow 0.3s, background-color 0.3s;
    text-align: center;
    overflow-wrap: break-word;
    position: relative;
  }

  .cella:hover { transform: translateY(-3px); box-shadow: 0 5px 12px rgba(0,0,0,0.2); }

  .cella.rosso { background-color: #fce8e8; color: #b30933; font-weight: bold; }
  .cella.bianco { background-color: #87A0CC; color: white; }
  .cella.giallo { background-color: #ffeb99; color: #555; }
  .cella.verde { background-color: #a0e7a0; color: #333; }
  .cella.blu { background-color: #c0d9f0; color: #4c565c; }
  
  .cella.evidenziato {
    background-color: #4da6ff !important;
    color: white !important;
    transform: scale(1.05) translateY(-5px); 
    box-shadow: 0 8px 20px rgba(77, 166, 255, 0.5);
    border: 3px solid white; 
  }

  .cella .prezzo-vecchio { text-decoration: line-through; font-size: 0.85em; color: #666; margin-bottom: 2px; }
  .cella .prezzo-nuovo { font-weight: bold; color: black; margin-bottom: 2px; }
  .cella .comune { font-size: 0.8em; color: #333; }
  .cella .rif { font-weight: bold; margin-bottom: 2px; }

  .sostituzione-container {
    margin-top: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background-color: #ffffff;
  }

  .sostituzione-container input[type="text"] {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
    font-size: 14px;
    width: 80px;
    text-align: center;
  }

  #bottoneSostituzione {
    background-color: #b30933;
    padding: 8px 15px;
    font-size: 14px;
    border-radius: 5px;
    color: white;
    border: none;
    cursor: pointer;
  }

  .cella button {
    margin-top: 4px;
    font-size: 10px;
    padding: 2px 5px;
    border: none;
    border-radius: 5px;
    background-color: #ff8c00;
    color: white;
    cursor: pointer;
  }

  #bottoneCerca { 
    padding: 8px 15px;
    background-color: #007bff;
    border-radius: 5px;
    color: white;
    border: none;
    cursor: pointer;
  }

  .conteggi { margin-top: 20px; font-weight: bold; display: flex; gap: 30px; justify-content: center; font-size: 14px; }

  #loading {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(255, 255, 255, 0.9); padding: 15px 30px; border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2); z-index: 1000; display: none;
  }

  #toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background-color: #333; color: white; padding: 10px 20px; border-radius: 5px; z-index: 1000; display: none;
  }

  #modal {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background-color: rgba(0, 0, 0, 0.5); display: none; justify-content: center; align-items: center; z-index: 1000;
  }

  #modalContainer { background-color: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
  #modalButtons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
  
  #modalConfirm { background-color: #b30933; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
  #modalCancel { background-color: #ccc; border: none; padding: 8px 15px; cursor: pointer; border-radius: 5px; }

  .fade { animation: fadeIn 0.4s ease-in-out; }
  @keyframes fadeIn { 0% { opacity: 0; transform: scale(0.9); } 100% { opacity: 1; transform: scale(1); } }
</style>
</head>
<body>

<h1>Dashboard Vetrine</h1>

<div>
  <label for="selezionaAgenzia">Seleziona Agenzia:</label>
  <select id="selezionaAgenzia">
    <option value="portogruaro">Portogruaro</option>
    <option value="sanvito">San Vito</option>
    <option value="pordenone">Pordenone</option>
  </select>
</div>

<div class="griglia" id="griglia"></div>

<div id="loading">Caricamento dati...</div>

<div class="cerca-container">
    <input type="text" id="inputRicerca" placeholder="Cerca Riferimento">
    <button id="bottoneCerca">Cerca</button>
</div>

<div class="sostituzione-container">
    <label>Sostituisci:</label>
    <input type="text" id="rifVecchio" placeholder="RIF Vecchio">
    <label>con:</label>
    <input type="text" id="rifNuovo" placeholder="RIF Nuovo">
    <button id="bottoneSostituzione">Sostituisci</button>
</div>
  
<div class="conteggi">
  <div>Cartelli totali: <span id="totale">0</span></div>
  <div>Ribassi da fare: <span id="ribassi">0</span></div>
  <div>Offline: <span id="offline">0</span></div>
</div>

<div id="modal">
    <div id="modalContainer">
        <div id="modalContent"></div>
        <div id="modalButtons">
            <button id="modalCancel">Annulla</button>
            <button id="modalConfirm">Conferma</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<script>
const WORKER_BASE = "https://vetrine.it-immobiliarenordest.workers.dev"; 
const TIMEOUT_MS = 8000;

// API Helpers
async function fetchWithTimeout(url, opts = {}, timeout = TIMEOUT_MS) {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), timeout);
    try {
        const res = await fetch(url, { ...opts, signal: controller.signal });
        clearTimeout(id);
        return res;
    } catch (err) {
        clearTimeout(id);
        throw err;
    }
}

async function getAllVetrine() {
    const res = await fetchWithTimeout(`${WORKER_BASE}/vetrine`);
    const body = await res.json();
    if (!body.success) throw new Error(body.error || "Errore API");
    return body.data; 
}

async function postRibasso(rif, nuovoPrezzo) {
    const res = await fetchWithTimeout(`${WORKER_BASE}/vetrine/ribasso`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rif: String(rif), nuovo_prezzo: Number(nuovoPrezzo) })
    });
    return res.json();
}

async function postPlaceholder(rif, placeholder) {
    const res = await fetchWithTimeout(`${WORKER_BASE}/vetrine/placeholder`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rif: String(rif), placeholder: !!placeholder })
    });
    return res.json();
}

async function postSostituzione(rifVecchio, rifNuovo) {
    const agenziaCorrente = selectAgenzia.value;
    const res = await fetchWithTimeout(`${WORKER_BASE}/vetrine/sostituzione`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ rif_vecchio: String(rifVecchio), rif_nuovo: String(rifNuovo), agenzia: agenziaCorrente })
    });
    return res.json();
}

// UI State
const agenzieBlocchi = { portogruaro: [4, 4, 3, 4, 5], sanvito: [2, 2, 2], pordenone: [3, 5] };
const righe = 3;
let allData = {}; 
let rifDaCercare = '';
let pendingAction = null;

const grigliaDiv = document.getElementById('griglia');
const selectAgenzia = document.getElementById('selezionaAgenzia');
const inputRicerca = document.getElementById('inputRicerca');
const bottoneCerca = document.getElementById('bottoneCerca');
const modalBack = document.getElementById('modal');
const modalContent = document.getElementById('modalContent');
const modalConfirm = document.getElementById('modalConfirm');
const modalCancel = document.getElementById('modalCancel');
const loadingEl = document.getElementById('loading');
const toast = document.getElementById('toast');
const inputRifVecchio = document.getElementById('rifVecchio');
const inputRifNuovo = document.getElementById('rifNuovo');
const bottoneSostituzione = document.getElementById('bottoneSostituzione');

// Utility functions
function formatMoney(n){ return Number(n).toLocaleString('it-IT'); }
function daysSince(dateStr){
    if (!dateStr) return 9999;
    const diff = new Date() - new Date(dateStr);
    return Math.floor(diff / (1000*60*60*24));
}
function showModal(html, confirmText = "Conferma"){
    modalContent.innerHTML = html;
    modalConfirm.textContent = confirmText;
    modalBack.style.display='flex';
}
function showToast(msg, ms=2500){
    toast.innerText = msg;
    toast.style.display='block';
    setTimeout(()=>{ toast.style.display='none'; }, ms);
}
function showLoading(flag){ loadingEl.style.display = flag ? 'block' : 'none'; }

function computeClass(item){
    if (!item) return 'rosso'; 
    if (item.segnaposto) return 'bianco';
    if (item.prezzo_myagency === 0) return 'rosso'; 
    const prezzo = Number(item.prezzo || 0);
    const prezzo_ref = Number(item.prezzo_myagency || item.prezzo || 0);
    if (prezzo > prezzo_ref) return 'giallo'; 
    if (daysSince(item.timestamp) > 180) return 'blu';
    return 'verde';
}

async function loadData(){
    showLoading(true);
    try {
        const data = await getAllVetrine();
        if (Array.isArray(data)) {
            const grouped = {};
            data.forEach(it => {
                const ag = it.agenzia || 'portogruaro';
                grouped[ag] = grouped[ag] || [];
                grouped[ag].push(it);
            });
            allData = grouped;
        } else { allData = data; }
        renderGriglia();
    } catch (err) { showToast('Errore: ' + err.message); }
    finally { showLoading(false); }
}

function renderGriglia(highlightRif){
    const agenzia = selectAgenzia.value;
    
    // AGGIORNAMENTO URL
    const currentUrl = new URL(window.location.href);
    if (currentUrl.searchParams.get('agenzia') !== agenzia) {
        currentUrl.searchParams.set('agenzia', agenzia);
        window.history.pushState({ path: currentUrl.href }, '', currentUrl.href);
    }

    const blocchi = agenzieBlocchi[agenzia];
    const immobiliFiltrati = allData[agenzia] || []; 
    grigliaDiv.innerHTML = '';
    
    let indice = 0;
    let countRibasso = 0, countOffline = 0;

    const celleTotali = blocchi.reduce((sum, current) => sum + current, 0) * righe;
    const immobiliPerGriglia = [...immobiliFiltrati];
    while (immobiliPerGriglia.length < celleTotali) { immobiliPerGriglia.push(null); }

    immobiliFiltrati.forEach(immobile => {
        const cls = computeClass(immobile);
        if (cls === 'giallo') countRibasso++;
        if (cls === 'rosso') countOffline++;
    });

    document.getElementById('totale').textContent = immobiliFiltrati.length;
    document.getElementById('ribassi').textContent = countRibasso;
    document.getElementById('offline').textContent = countOffline;

    for (let r = 0; r < righe; r++) {
        const rigaDiv = document.createElement('div');
        rigaDiv.classList.add('riga');

        blocchi.forEach((colonne) => {
            const bloccoDiv = document.createElement('div');
            bloccoDiv.classList.add('blocco');

            for (let c = 0; c < colonne; c++) {
                const immobile = immobiliPerGriglia[indice];
                const cella = document.createElement('div');
                cella.className = 'cella fade';
                
                const cls = computeClass(immobile);
                cella.classList.add(cls);

                if (cls === 'rosso') {
                    if (immobile && immobile.rif) {
                        cella.innerHTML = `<div class="rif">${immobile.rif}</div><div>OFFLINE</div>`;
                    } else { cella.textContent = "OFFLINE"; }
                } 
                else if (cls === 'bianco') {
                    cella.innerHTML = `<div class="rif">${immobile.rif}</div><div style="font-weight:bold;margin-top:5px">SEGNAPOSTO</div>`;
                } 
                else if (immobile) {
                    const prezzoCorrente = formatMoney(immobile.prezzo);
                    if (cls === 'giallo') {
                        cella.innerHTML = `<div class="rif">${immobile.rif}</div><div class="prezzo-vecchio">${prezzoCorrente} €</div><div class="prezzo-nuovo">↓ ${formatMoney(immobile.prezzo_myagency)} €</div>`;
                    } else {
                        cella.innerHTML = `<div class="rif">${immobile.rif}</div><div class="prezzo-nuovo">${prezzoCorrente} €</div><div class="comune">${immobile.comune}</div>`;
                    }
                }

                if (immobile && immobile.rif && rifDaCercare && String(immobile.rif).toLowerCase() === rifDaCercare.toLowerCase()) {
                    cella.classList.add('evidenziato');
                    if (highlightRif === immobile.rif) setTimeout(() => cella.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
                }

                if (cls === 'giallo') {
                    const btn = document.createElement('button');
                    btn.textContent = "Aggiorna";
                    btn.onclick = (e) => { e.stopPropagation(); onCellAction('ribasso', immobile); };
                    cella.appendChild(btn);
                }
                
                if (immobile && cls !== 'giallo') {
                    cella.onclick = () => onCellAction('placeholder', immobile);
                }

                bloccoDiv.appendChild(cella);
                indice++;
            }
            rigaDiv.appendChild(bloccoDiv);
        });
        grigliaDiv.appendChild(rigaDiv);
    }
}

async function onCellAction(action, item){
    if (action === 'ribasso') {
        showModal(`<div>RIF: <b>${item.rif}</b></div><div>Prezzo: da € ${formatMoney(item.prezzo)} a <b>€ ${formatMoney(item.prezzo_myagency)}</b>?</div>`, "Conferma Ribasso");
        pendingAction = { type: 'ribasso', rif: item.rif, payload: { nuovo: item.prezzo_myagency } };
    } else if (action === 'placeholder') {
        const newVal = !item.segnaposto;
        showModal(`<div>RIF: <b>${item.rif}</b></div><div>Impostare Segnaposto: <b>${newVal ? 'SI' : 'NO'}</b>?</div>`, "Conferma");
        pendingAction = { type: 'placeholder', rif: item.rif, payload: { placeholder: newVal } };
    }
}

modalConfirm.onclick = async () => {
    if (!pendingAction) return;
    modalBack.style.display = 'none';
    showToast('Eseguo...');
    try {
        let resp;
        if (pendingAction.type === 'ribasso') resp = await postRibasso(pendingAction.rif, pendingAction.payload.nuovo);
        else if (pendingAction.type === 'placeholder') resp = await postPlaceholder(pendingAction.rif, pendingAction.payload.placeholder);
        else if (pendingAction.type === 'sostituzione') resp = await postSostituzione(pendingAction.rifVecchio, pendingAction.rifNuovo);

        if (resp && resp.success) {
            showToast('Fatto!');
            await loadData();
            inputRifVecchio.value = ''; inputRifNuovo.value = '';
        } else { showToast('Errore: ' + resp.error); }
    } catch (err) { showToast('Errore rete'); }
    finally { pendingAction = null; }
};

bottoneSostituzione.onclick = () => {
    const v = inputRifVecchio.value.trim(), n = inputRifNuovo.value.trim();
    if (!v || !n) return showToast('Inserisci i RIF');
    showModal(`<div>Sostituire <b>${v}</b> con <b>${n}</b>?</div>`, "Sostituisci");
    pendingAction = { type: 'sostituzione', rifVecchio: v, rifNuovo: n };
};

bottoneCerca.onclick = () => {
    rifDaCercare = inputRicerca.value.trim();
    renderGriglia(rifDaCercare);
};

// GESTIONE CAMBIO TENDINA
selectAgenzia.onchange = () => renderGriglia();
modalCancel.onclick = () => { modalBack.style.display='none'; pendingAction=null; };

// INIZIALIZZAZIONE ALL'AVVIO
const params = new URLSearchParams(window.location.search);
const agenziaUrl = params.get('agenzia');
if (agenziaUrl && agenzieBlocchi.hasOwnProperty(agenziaUrl)) {
    selectAgenzia.value = agenziaUrl;
}

loadData();
</script>
</body>
</html>
